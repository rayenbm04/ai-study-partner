[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["venv", "chroma_db", "node_store", "uploads", "slides_cache", "__pycache__"]

[tool.ruff.lint]
# Keep the initial bar low on an existing 3k+ line codebase: catch real bugs
# (undefined names, unused imports) without forcing a style rewrite.
select = ["E9", "F"]
ignore = [
    "F401",  # unused imports — main.py has some intentionally re-exported for mcp_server.py
    "F841",  # unused local variables — noisy on this codebase for now
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]
