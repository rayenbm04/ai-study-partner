# Local dev stack for the new backend: Postgres (with pgvector) + the API,
# migrations applied automatically on startup. Separate from the root
# docker-compose.yml, which still runs the old rag-backend/rag-frontend.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_study_coach
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_study_coach
      SECRET_KEY: dev-only-secret-change-me
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8081
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
